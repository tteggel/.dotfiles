name: Build NixOS-WSL Installer

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/determinate-nix-action@main
    - uses: cachix/cachix-action@v17
      with:
        name: numtide
    - run: nix build .#nixosConfigurations.thixos.config.system.build.toplevel
    - run: nix build .#nixosConfigurations.yoloixos.config.system.build.tarballBuilder
    - run: sudo ./result/bin/nixos-wsl-tarball-builder yoloixos.wsl
    - uses: anothrNick/github-tag-action@1.75.0
      id: tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch
        TAG_PREFIX: v
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.new_tag  }}
        files: |
          yoloixos.wsl
